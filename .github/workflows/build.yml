name: Deploy ScanMind to GitHub Pages

# 1. Événements déclencheurs
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. Autorisations nécessaires pour publier sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 3. Empêche les déploiements simultanés en cas de pushes très rapprochés
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # --- JOB 1 : COMPILATION ---
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Récupérer le code source
      uses: actions/checkout@v4

    - name: ⚙️ Configurer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📦 Installer les dépendances
      run: npm ci

    - name: 🏗️ Compiler le projet React (Vite)
      run: npm run build

    - name: 📂 Préparer les fichiers pour GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist' # Dossier de sortie du build Vite

  # --- JOB 2 : DÉPLOIEMENT SUR GITHUB PAGES ---
  deploy:
    # Le déploiement s'exécute uniquement lors d'un push sur 'main' (pas sur les Pull Requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # Attend que le job "build" soit terminé avec succès
    steps:
      - name: 🚀 Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4